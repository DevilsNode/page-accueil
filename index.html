<html lang="fr">
<head>
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23121212'/%3E%3Ctext x='50' y='67' text-anchor='middle' font-family='Inter, Arial, Helvetica, sans-serif' font-size='48' font-weight='600' fill='%23b88bd0'%3ETM%3C/text%3E%3C/svg%3E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Page d'accueil">

    <title>Tristan Meszaros</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at 50% 40%, #1b1325 0%, #0d0b10 45%, #08070a 100%);

            color: #f5f2f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            animation: fadeIn 1.2s ease-out;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 600;
            letter-spacing: -0.04em;
            margin-bottom: 40px;

            background: linear-gradient(
                135deg,
                #ffffff 0%,
                #ddd5e8 45%,
                #b99bce 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cv-button {
            display: inline-block;
            padding: 14px 32px;

            color: #e8d9f0;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.02em;

            border: 1px solid #b88bd0;
            border-radius: 10px;

            background: rgba(184, 139, 208, 0.05);

            box-shadow:
                0 0 12px rgba(184, 139, 208, 0.12),
                inset 0 0 12px rgba(184, 139, 208, 0.03);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .cv-button:hover {
            transform: translateY(-2px);

            background: rgba(184, 139, 208, 0.12);

            box-shadow:
                0 0 24px rgba(184, 139, 208, 0.25),
                inset 0 0 15px rgba(184, 139, 208, 0.06);
        }

        .cv-button:active {
            transform: translateY(0);
        }

        .typing-card {
            display: block;
            width: min(150px, 90vw);
            margin: 22px auto 0;
            padding: 14px 26px;
            color: #e8d9f0;
            text-decoration: none;
            border: 1px solid #b88bd0;
            border-radius: 10px;
            background: rgba(184, 139, 208, 0.04);
            box-shadow: 0 0 12px rgba(184, 139, 208, 0.08), inset 0 0 12px rgba(184, 139, 208, 0.02);
            transition: width 0.3s ease, transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
            overflow: hidden;
        }

        @media (hover: hover) and (pointer: fine) {
            .typing-card:hover {
                width: min(430px, 90vw);
                transform: translateY(-2px);
                background: rgba(184, 139, 208, 0.09);
                box-shadow: 0 0 24px rgba(184, 139, 208, 0.2), inset 0 0 15px rgba(184, 139, 208, 0.04);
            }
        }

        .typing-title {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .typing-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-height: 0;
            margin-top: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, margin-top 0.3s ease, opacity 0.25s ease;
        }

        @media (hover: hover) and (pointer: fine) {
            .typing-card:hover .typing-stats {
                max-height: 120px;
                margin-top: 18px;
                opacity: 1;
            }
        }

        .typing-stat {
            padding: 10px 6px;
            border: 1px solid rgba(184, 139, 208, 0.22);
            border-radius: 9px;
            background: rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .typing-stat-label {
            color: #a99eae;
            font-size: 0.72rem;
        }

        .typing-stat-value {
            margin-top: 3px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .typing-extra {
            grid-column: 1 / -1;
            color: #a99eae;
            font-size: 0.76rem;
            text-align: center;
        }

        @media (max-width: 520px) {
            .typing-card.is-expanded {
                width: min(90vw, 430px);
                transform: translateY(-2px);
                background: rgba(184, 139, 208, 0.09);
                box-shadow: 0 0 24px rgba(184, 139, 208, 0.2), inset 0 0 15px rgba(184, 139, 208, 0.04);
            }

            .typing-card.is-expanded .typing-stats {
                max-height: 120px;
                margin-top: 18px;
                opacity: 1;
            }

            .typing-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .social-links {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            z-index: 20;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: #a99eae;
            text-decoration: none;
            border-radius: 8px;
            transition: color 0.2s ease, transform 0.2s ease, background 0.2s ease;
        }

        .social-link:hover,
        .social-link:focus-visible {
            color: #e8d9f0;
            transform: translateY(-2px);
            background: rgba(184, 139, 208, 0.08);
            outline: none;
        }

        .social-link:focus-visible {
            box-shadow: 0 0 0 2px rgba(184, 139, 208, 0.35);
        }

        .social-link svg {
            width: 21px;
            height: 21px;
            fill: currentColor;
        }

        @media (max-width: 520px) {
            .social-links {
                bottom: 16px;
                gap: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>Tristan Meszaros</h1>

        <a
            class="cv-button"
            href="https://cv.meszaros.fr"
        >
            CV en ligne
        </a>

        <div
            class="typing-card"
            role="button"
            tabindex="0"
            aria-expanded="false"
        >
            <div class="typing-title">Dactylo</div>

            <div class="typing-stats" aria-label="Statistiques Monkeytype">
                <div class="typing-stat">
                    <div class="typing-stat-label">15s</div>
                    <div class="typing-stat-value" id="typing-15">—</div>
                </div>
                <div class="typing-stat">
                    <div class="typing-stat-label">30s</div>
                    <div class="typing-stat-value" id="typing-30">—</div>
                </div>
                <div class="typing-stat">
                    <div class="typing-stat-label">60s</div>
                    <div class="typing-stat-value" id="typing-60">—</div>
                </div>
                <div class="typing-stat">
                    <div class="typing-stat-label">120s</div>
                    <div class="typing-stat-value" id="typing-120">—</div>
                </div>
                <div class="typing-extra" id="typing-total">Chargement des statistiques…</div>
            </div>
        </div>
    </main>




    <nav class="social-links" aria-label="Réseaux et contact">
        <a class="social-link" href="https://github.com/DevilsNode" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">

        </a>
        <a class="social-link" href="https://www.linkedin.com/in/tristan-meszaros-39b706433" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.58c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.68H9.35V8.99h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.26 2.37 4.26 5.45v6.3ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM3.56 20.45h3.56V8.99H3.56v11.46ZM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.72V1.72C24 .77 23.21 0 22.23 0Z"/></svg>
        </a>
        <a class="social-link" href="mailto:tristan@meszaros.fr" aria-label="E-mail" title="E-mail">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5v2Z"/></svg>
        </a>
    </nav>

    <script>
        const typingStats = {
            "15": document.getElementById("typing-15"),
            "30": document.getElementById("typing-30"),
            "60": document.getElementById("typing-60"),
            "120": document.getElementById("typing-120"),
        };
        const typingTotal = document.getElementById("typing-total");
        const typingCard = document.querySelector(".typing-card");

        // PC : ouverture uniquement au survol (CSS).
        // Mobile : un tap bascule entre fermé et ouvert.
        const isTouchDevice = window.matchMedia("(hover: none) and (pointer: coarse)").matches;

        if (isTouchDevice) {
            const toggleTypingCard = () => {
                const expanded = typingCard.classList.toggle("is-expanded");
                typingCard.setAttribute("aria-expanded", String(expanded));
            };

            typingCard.addEventListener("click", event => {
                event.preventDefault();
                event.stopPropagation();
                toggleTypingCard();
            });
            typingCard.addEventListener("keydown", event => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    toggleTypingCard();
                }
            });
        }

        fetch("https://api.monkeytype.com/users/devilsnode/profile")
            .then(response => {
                if (!response.ok) throw new Error("Monkeytype API indisponible");
                return response.json();
            })
            .then(({ data }) => {
                const timePBs = data?.personalBests?.time || {};

                ["15", "30", "60", "120"].forEach(seconds => {
                    const entries = timePBs[seconds] || [];
                    const best = entries[0];
                    typingStats[seconds].textContent = best?.wpm ? `${Math.round(best.wpm)} WPM` : "—";
                });

                const completed = data?.completedTests;
                const timeTyping = data?.timeTyping;
                const parts = [];

                if (typeof completed === "number") {
                    parts.push(`${completed.toLocaleString("fr-FR")} tests`);
                }

                if (typeof timeTyping === "number") {
                    const totalSeconds = Math.round(timeTyping);
                    const hours = Math.floor(totalSeconds / 3600);
                    const minutes = Math.floor((totalSeconds % 3600) / 60);
                    parts.push(`${hours}h ${String(minutes).padStart(2, "0")}m`);
                }

                typingTotal.textContent = parts.length ? parts.join(" · ") : "Statistiques Monkeytype";
            })
            .catch(() => {
                typingTotal.textContent = "Statistiques indisponibles";
            });
    </script>

</body>
</html>
