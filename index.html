<html lang="fr">
<head>
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23121212'/%3E%3Ctext x='50' y='67' text-anchor='middle' font-family='Inter, Arial, Helvetica, sans-serif' font-size='48' font-weight='600' fill='%23b88bd0'%3ETM%3C/text%3E%3C/svg%3E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Page d'accueil">

    <title>Tristan Meszaros</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at 50% 40%, #1b1325 0%, #0d0b10 45%, #08070a 100%);

            color: #f5f2f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            animation: fadeIn 1.2s ease-out;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 600;
            letter-spacing: -0.04em;
            margin-bottom: 40px;

            background: linear-gradient(
                135deg,
                #ffffff 0%,
                #ddd5e8 45%,
                #b99bce 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cv-button {
            display: inline-block;
            padding: 14px 32px;

            color: #e8d9f0;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.02em;

            border: 1px solid #b88bd0;
            border-radius: 10px;

            background: rgba(184, 139, 208, 0.05);

            box-shadow:
                0 0 12px rgba(184, 139, 208, 0.12),
                inset 0 0 12px rgba(184, 139, 208, 0.03);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .cv-button:hover {
            transform: translateY(-2px);

            background: rgba(184, 139, 208, 0.12);

            box-shadow:
                0 0 24px rgba(184, 139, 208, 0.25),
                inset 0 0 15px rgba(184, 139, 208, 0.06);
        }

        .cv-button:active {
            transform: translateY(0);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>Tristan Meszaros</h1>

        <a
            class="cv-button"
            href="https://cv.meszaros.fr"
        >
            CV en ligne
        </a>
    </main>

</body>
</html>
