<html lang="fr">
<head>
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23121212'/%3E%3Ctext x='50' y='67' text-anchor='middle' font-family='Inter, Arial, Helvetica, sans-serif' font-size='48' font-weight='600' fill='%23b88bd0'%3ETM%3C/text%3E%3C/svg%3E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Page d'accueil">

    <title>Tristan Meszaros</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at 50% 40%, #1b1325 0%, #0d0b10 45%, #08070a 100%);

            color: #f5f2f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            animation: fadeIn 1.2s ease-out;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 600;
            letter-spacing: -0.04em;
            margin-bottom: 40px;

            background: linear-gradient(
                135deg,
                #ffffff 0%,
                #ddd5e8 45%,
                #b99bce 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cv-button {
            display: inline-block;
            padding: 14px 32px;

            color: #e8d9f0;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.02em;

            border: 1px solid #b88bd0;
            border-radius: 10px;

            background: rgba(184, 139, 208, 0.05);

            box-shadow:
                0 0 12px rgba(184, 139, 208, 0.12),
                inset 0 0 12px rgba(184, 139, 208, 0.03);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .cv-button:hover {
            transform: translateY(-2px);

            background: rgba(184, 139, 208, 0.12);

            box-shadow:
                0 0 24px rgba(184, 139, 208, 0.25),
                inset 0 0 15px rgba(184, 139, 208, 0.06);
        }

        .cv-button:active {
            transform: translateY(0);
        }

        .typing-card {
            display: block;
            width: min(150px, 90vw);
            margin: 22px auto 0;
            padding: 14px 26px;
            color: #e8d9f0;
            text-decoration: none;
            border: 1px solid #b88bd0;
            border-radius: 10px;
            background: rgba(184, 139, 208, 0.04);
            box-shadow: 0 0 12px rgba(184, 139, 208, 0.08), inset 0 0 12px rgba(184, 139, 208, 0.02);
            transition: width 0.3s ease, transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
            overflow: hidden;
        }

        .typing-card:hover {
            width: min(430px, 90vw);
            transform: translateY(-2px);
            background: rgba(184, 139, 208, 0.09);
            box-shadow: 0 0 24px rgba(184, 139, 208, 0.2), inset 0 0 15px rgba(184, 139, 208, 0.04);
        }

        .typing-title {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .typing-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-height: 0;
            margin-top: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, margin-top 0.3s ease, opacity 0.25s ease;
        }

        .typing-card:hover .typing-stats {
            max-height: 120px;
            margin-top: 18px;
            opacity: 1;
        }

        .typing-stat {
            padding: 10px 6px;
            border: 1px solid rgba(184, 139, 208, 0.22);
            border-radius: 9px;
            background: rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .typing-stat-label {
            color: #a99eae;
            font-size: 0.72rem;
        }

        .typing-stat-value {
            margin-top: 3px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .typing-extra {
            grid-column: 1 / -1;
            color: #a99eae;
            font-size: 0.76rem;
            text-align: center;
        }

        @media (max-width: 520px) {
            .typing-card.is-expanded {
                width: min(90vw, 430px);
                transform: translateY(-2px);
                background: rgba(184, 139, 208, 0.09);
                box-shadow: 0 0 24px rgba(184, 139, 208, 0.2), inset 0 0 15px rgba(184, 139, 208, 0.04);
            }

            .typing-card.is-expanded .typing-stats {
                max-height: 120px;
                margin-top: 18px;
                opacity: 1;
            }

            .typing-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>Tristan Meszaros</h1>

        <a
            class="cv-button"
            href="https://cv.meszaros.fr"
        >
            CV en ligne
        </a>

        <div
            class="typing-card"
            role="button"
            tabindex="0"
            aria-expanded="false"
        >
            <div class="typing-title">Dactylo</div>

            <div class="typing-stats" aria-label="Statistiques Monkeytype">
                <div class="typing-stat">
                    <div class="typing-stat-label">15s</div>
                    <div class="typing-stat-value" id="typing-15">—</div>
                </div>
                <div class="typing-stat">
                    <div class="typing-stat-label">30s</div>
                    <div class="typing-stat-value" id="typing-30">—</div>
                </div>
                <div class="typing-stat">
                    <div class="typing-stat-label">60s</div>
                    <div class="typing-stat-value" id="typing-60">—</div>
                </div>
                <div class="typing-stat">
                    <div class="typing-stat-label">120s</div>
                    <div class="typing-stat-value" id="typing-120">—</div>
                </div>
                <div class="typing-extra" id="typing-total">Chargement des statistiques…</div>
            </div>
        </div>
    </main>


    <script>
        const typingStats = {
            "15": document.getElementById("typing-15"),
            "30": document.getElementById("typing-30"),
            "60": document.getElementById("typing-60"),
            "120": document.getElementById("typing-120"),
        };
        const typingTotal = document.getElementById("typing-total");
        const typingCard = document.querySelector(".typing-card");

        // PC : ouverture uniquement au survol (CSS).
        // Mobile : un tap bascule entre fermé et ouvert.
        const isTouchDevice = window.matchMedia("(hover: none) and (pointer: coarse)").matches;

        if (isTouchDevice) {
            const toggleTypingCard = () => {
                const expanded = typingCard.classList.toggle("is-expanded");
                typingCard.setAttribute("aria-expanded", String(expanded));
            };

            typingCard.addEventListener("click", toggleTypingCard);
            typingCard.addEventListener("keydown", event => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    toggleTypingCard();
                }
            });
        }

        fetch("https://api.monkeytype.com/users/devilsnode/profile")
            .then(response => {
                if (!response.ok) throw new Error("Monkeytype API indisponible");
                return response.json();
            })
            .then(({ data }) => {
                const timePBs = data?.personalBests?.time || {};

                ["15", "30", "60", "120"].forEach(seconds => {
                    const entries = timePBs[seconds] || [];
                    const best = entries[0];
                    typingStats[seconds].textContent = best?.wpm ? `${Math.round(best.wpm)} WPM` : "—";
                });

                const completed = data?.completedTests;
                const timeTyping = data?.timeTyping;
                const parts = [];

                if (typeof completed === "number") {
                    parts.push(`${completed.toLocaleString("fr-FR")} tests`);
                }

                if (typeof timeTyping === "number") {
                    const totalSeconds = Math.round(timeTyping);
                    const hours = Math.floor(totalSeconds / 3600);
                    const minutes = Math.floor((totalSeconds % 3600) / 60);
                    parts.push(`${hours}h ${String(minutes).padStart(2, "0")}m`);
                }

                typingTotal.textContent = parts.length ? parts.join(" · ") : "Profil Monkeytype";
            })
            .catch(() => {
                typingTotal.textContent = "Statistiques indisponibles";
            });
    </script>

</body>
</html>
